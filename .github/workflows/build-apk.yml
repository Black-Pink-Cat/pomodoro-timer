name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    container:
      image: kivy/buildozer:latest
    steps:
      - uses: actions/checkout@v4

      - name: Show disk space
        run: df -h

      - name: Build APK
        run: |
          buildozer android debug

      - name: Check build result
        if: always()
        run: |
          echo "=== Build directory ==="
          ls -la ./
          echo "=== Bin directory ==="
          ls -la bin/ 2>/dev/null || echo "No bin dir"
          find . -name "*.apk" 2>/dev/null || echo "No APK files found"
          echo "=== Last 50 lines of buildozer log ==="
          tail -50 .buildozer/android/platform/buildozer.log 2>/dev/null || echo "No log"

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pomodoro-apk
          path: bin/*.apk
