name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update -qq
          sudo apt install -y -qq autoconf automake libtool libffi-dev libltdl-dev \
            openjdk-17-jdk python3-pip git zip unzip

      - name: Install buildozer
        run: pip install buildozer cython

      - name: Build APK
        run: |
          export BUILDOZER_WARN_ON_ROOT=0
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pomodoro-apk
          path: bin/*.apk
